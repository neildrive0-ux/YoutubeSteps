kind = "mobile"
previewPath = "/mobile/"
title = "Ai SnowRemoval Mobile"
description = "A native mobile companion for Ai Landscaping & SnowRemoval, giving Grande Prairie customers quick access to seasonal contracts, quote requests, service details, and direct contact actions."
version = "1.0.0"
id = "artifacts/ai-snow-removal-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 21612

[services.development]
run = "pnpm --filter @workspace/ai-snow-removal-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-snow-removal-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ai-snow-removal-mobile", "run", "serve" ]

[services.env]
PORT = "21612"
BASE_PATH = "/mobile/"
