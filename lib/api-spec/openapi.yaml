openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quote-requests
    description: Quote request operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /quote-requests:
    post:
      operationId: createQuoteRequest
      tags: [quote-requests]
      summary: Submit a quote request
      description: Stores a quote request for the business team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequestInput"
      responses:
        "201":
          description: Quote request stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
        "200":
          description: Existing request returned for a safe retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
        "400":
          description: Invalid quote request
        "429":
          description: Too many requests
        "500":
          description: Unable to store quote request
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuoteRequestInput:
      type: object
      properties:
        requestId:
          type: string
          minLength: 16
          maxLength: 100
        name:
          type: string
          minLength: 2
          maxLength: 160
        phone:
          type: string
          minLength: 10
          maxLength: 40
        email:
          type: string
          maxLength: 320
        address:
          type: string
          minLength: 3
          maxLength: 500
        propertyAreas:
          type: array
          minItems: 1
          maxItems: 11
          items:
            type: string
            enum:
              - driveway
              - sidewalk
              - staircase
              - back-alley-parking-pad
              - ice-control
              - lawn-mowing
              - yard-cleanup
              - garden-beds
              - hedge-trimming
              - sod-and-seeding
              - landscape-project
        website:
          type: string
          maxLength: 200
      required:
        - requestId
        - name
        - phone
        - email
        - address
        - propertyAreas
    QuoteRequest:
      type: object
      properties:
        id:
          type: number
        requestId:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        propertyAreas:
          type: array
          items:
            type: string
            enum:
              - driveway
              - sidewalk
              - staircase
              - back-alley-parking-pad
              - ice-control
              - lawn-mowing
              - yard-cleanup
              - garden-beds
              - hedge-trimming
              - sod-and-seeding
              - landscape-project
        status:
          type: string
          enum: [new]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - requestId
        - name
        - phone
        - email
        - address
        - propertyAreas
        - status
        - createdAt

